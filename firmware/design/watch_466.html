<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Clawd Watch · 真机 1:1 对照 (466×466)</title>
<style>
  body{margin:0;padding:40px;background:#1b1b1b;
    font-family:-apple-system,"SF Pro Display","Helvetica Neue",sans-serif;color:#ccc;}
  h1{font-size:22px;font-weight:700;text-align:center;margin:0 0 4px;color:#eee;}
  .note{text-align:center;color:#777;font-size:13px;margin:0 0 28px;max-width:600px;margin-inline:auto;line-height:1.6;}
  .pair{display:flex;flex-wrap:wrap;gap:48px;justify-content:center;align-items:flex-start;}
  .cap{color:#888;font-size:12px;margin-top:10px;max-width:466px;line-height:1.5;text-align:center;}
  .cap b{color:#aaa;}

  .watch{width:466px;height:466px;border-radius:50%;background:#000;
    position:relative;overflow:hidden;box-shadow:0 0 0 5px #2a2a2a,0 14px 40px rgba(0,0,0,.6);}
  .watch *{box-sizing:border-box;}
  .el{position:absolute;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap;line-height:1;}
  .ring{position:absolute;inset:0;}
  .chip{display:inline-block;border-radius:20px;font-weight:600;letter-spacing:.4px;}
  .pager{position:absolute;left:0;right:0;display:flex;gap:7px;justify-content:center;align-items:center;}
  .pdot{width:7px;height:7px;border-radius:50%;background:#3a3a3a;}
  .pdot.cur{background:#D97757;width:16px;height:7px;border-radius:3px;}
  .pet{position:absolute;} .pet i{position:absolute;display:block;}
  .sep{width:160px;height:1px;background:#7a7a7a;position:absolute;left:50%;transform:translateX(-50%);}
  .vsep{width:1px;height:110px;background:#7a7a7a;position:absolute;left:50%;transform:translateX(-50%);}
</style>
</head>
<body>

<h1>Clawd Watch · 真机 1:1 对照（466 × 466）</h1>
<p class="note">
  浏览器里这个圆 = 真机屏幕原尺寸（466px）。总览页含<b>电池电量条</b>；session 页圆环 ⌀450、110° 缺口、线宽 14；下滑打开按键参考。
</p>

<div class="pair">
  <div><div class="watch" id="ov"></div><div class="cap"><b>总览页</b> · 电池条 y44 · chip 22 · count 44 · sub 20</div></div>
  <div><div class="watch" id="se"></div><div class="cap"><b>session 页</b> · ⌀450 弧环 110° 缺口 · 线宽 14 · 标题宽 260</div></div>
</div>

<div style="height:48px"></div>

<div class="pair">
  <div><div class="watch" id="cs"></div><div class="cap"><b>按键参考</b> · 首页下滑打开 · tap 任意处关闭</div></div>
</div>

<script>
const ORANGE="#D97757", GREY="#8a8a8a", DIM="#5e5e5e", DIMORANGE="#9c6b56", DIMIDLE="#555", WHITE="#fff";

function el(parent, {align, dy=0, font, color=WHITE, text, chip, chipBg, ls}){
  const d=document.createElement('div');
  d.className='el'+(chip?' chip':'');
  d.style.fontSize=font+'px';
  d.style.color=color;
  if(ls) d.style.letterSpacing=ls+'px';
  if(chip){ d.style.background=chipBg; d.style.padding=(font<16?'5px 14px':'7px 18px'); }
  if(align==='top'){ d.style.top=dy+'px'; }
  else if(align==='bottom'){ d.style.bottom=dy+'px'; d.style.top='auto'; }
  else { d.style.top='50%'; d.style.transform=`translate(-50%, calc(-50% + ${dy}px))`; }
  d.innerHTML=text;
  parent.appendChild(d);
  return d;
}

// 像素吉祥物 — idle 态静态帧。root 192×166，char 部分偏移 kCharY=24。
// zzz 浮在 parent 层（不被 _root 裁剪）。
function pet(parent, cx, cy){
  const W=192,H=166,kCharY=24;
  const p=document.createElement('div');
  p.className='pet';
  p.style.left=(cx-W/2)+'px'; p.style.top=(cy-H/2)+'px';
  p.style.width=W+'px'; p.style.height=H+'px';
  const rects=[
    [0,kCharY+22,22,22,DIMORANGE],[170,kCharY+22,22,22,DIMORANGE],  // claws
    [22,kCharY,148,86,DIMORANGE],                                     // body
    [34,kCharY+86,19,30,DIMORANGE],[67,kCharY+86,19,30,DIMORANGE],   // legs
    [106,kCharY+86,19,30,DIMORANGE],[139,kCharY+86,19,30,DIMORANGE],
    [50,kCharY+34,22,6,'#0d0d0d'],[120,kCharY+34,22,6,'#0d0d0d'],   // eye-lines (idle)
  ];
  for(const [x,y,w,h,c] of rects){
    const i=document.createElement('i');
    i.style.left=x+'px'; i.style.top=y+'px'; i.style.width=w+'px'; i.style.height=h+'px'; i.style.background=c;
    p.appendChild(i);
  }
  // zzz — 浮在宠物上方，用 parent 坐标系
  const zzzColor='#6a6a6a';
  const rootTop=cy-H/2;
  for(let i=0;i<3;i++){
    const z=document.createElement('div');
    z.style.cssText=`position:absolute;font-size:${18+i*4}px;color:${zzzColor};
      left:${cx-W/2+162+i*16}px;top:${rootTop+kCharY-4-i*18}px;line-height:1;`;
    z.textContent='z';
    parent.appendChild(z);
  }
  parent.appendChild(p);
}

function ringArc(parent, dia, stroke, pct, color, gapDeg){
  const r=(dia-stroke)/2, c=233, circ=2*Math.PI*r;
  const trackLen=circ*(360-gapDeg)/360;
  const rot=90+gapDeg/2;
  parent.insertAdjacentHTML('beforeend',
    `<svg class="ring" viewBox="0 0 466 466">
       <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#1f1814" stroke-width="${stroke}"
               stroke-linecap="round" stroke-dasharray="${trackLen} ${circ}" transform="rotate(${rot} ${c} ${c})"/>
       <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
               stroke-linecap="round" stroke-dasharray="${trackLen*pct/100} ${circ}" transform="rotate(${rot} ${c} ${c})"/>
     </svg>`);
}

function pager(parent, n, active, dy){
  const w=document.createElement('div'); w.className='pager';
  w.style.bottom=dy+'px';
  for(let i=0;i<n;i++){ const s=document.createElement('span'); s.className='pdot'+(i===active?' cur':''); w.appendChild(s); }
  parent.appendChild(w);
}

function line(parent, cssClass, alignY, dy){
  const d=document.createElement('div');
  d.className=cssClass;
  d.style.top=(233+dy)+'px';
  parent.appendChild(d);
}

const chipBgWorking="#33221a";

// ───── 总览页 ─────
(function(){
  const w=document.getElementById('ov');
  const BAT_W=110, BAT_H=5, BAT_Y=44;
  const batTrack=document.createElement('div');
  batTrack.style.cssText=`position:absolute;left:50%;top:${BAT_Y-BAT_H/2}px;transform:translateX(-50%);
    width:${BAT_W}px;height:${BAT_H}px;border-radius:${BAT_H/2}px;background:#2a2a2a;`;
  const batFill=document.createElement('div');
  batFill.style.cssText=`position:absolute;left:0;top:0;width:${Math.round(BAT_W*0.72)}px;height:100%;
    border-radius:${BAT_H/2}px;background:#c49a6c;`;
  batTrack.appendChild(batFill);
  w.appendChild(batTrack);
  const batPct=document.createElement('div');
  batPct.className='el';
  batPct.style.cssText=`position:absolute;top:${BAT_Y-7}px;left:calc(50% + ${BAT_W/2+6}px);
    font-size:14px;color:#555;line-height:1;white-space:nowrap;`;
  batPct.textContent='72';
  w.appendChild(batPct);

  el(w,{align:'top',dy:104,font:22,chip:1,chipBg:chipBgWorking,color:ORANGE,text:'working'});
  pet(w,233,237);
  el(w,{align:'center',dy:118,font:44,color:WHITE,text:'2 / 3'});
  el(w,{align:'center',dy:166,font:20,color:GREY,text:'running'});
  pager(w,4,0,38);
})();

// token 四宫格
function tokenGrid(parent, cy, items){
  const colGap=58, rowGap=80, labelF=13, valF=24;
  const g=document.createElement('div');
  g.style.position='absolute'; g.style.left='50%'; g.style.top=cy+'px';
  g.style.transform='translate(-50%,-50%)';
  g.style.display='grid';
  g.style.gridTemplateColumns=`auto auto`;
  g.style.columnGap=colGap+'px'; g.style.rowGap=rowGap+'px';
  for(const [label,val] of items){
    const cell=document.createElement('div'); cell.style.textAlign='center';
    cell.innerHTML=`<div style="font-size:${valF}px;color:#fff;line-height:1;white-space:nowrap;">${val}</div>`
                  +`<div style="font-size:${labelF}px;color:#8a8a8a;letter-spacing:.5px;margin-top:4px;white-space:nowrap;">${label}</div>`;
    g.appendChild(cell);
  }
  parent.appendChild(g);
}

// ───── session 页 ─────
(function(){
  const w=document.getElementById('se');
  ringArc(w,462,14,70,ORANGE,110);
  el(w,{align:'top',dy:84,font:22,color:WHITE,text:'claude-code-stopwatch'});
  el(w,{align:'top',dy:120,font:16,chip:1,chipBg:chipBgWorking,color:ORANGE,text:'working'});
  tokenGrid(w,242,[
    ['INPUT','15.5k'],['OUTPUT','1.2k'],
    ['CACHE HIT','82k'],['CACHE WRITE','5.0k'],
  ]);
  el(w,{align:'bottom',dy:44,font:14,color:GREY,text:'sonnet-4.5'});
  el(w,{align:'bottom',dy:58,font:14,color:'#7a7a7a',text:'Bash'});
  el(w,{align:'bottom',dy:74,font:16,color:WHITE,text:'$12.34'});
  pager(w,4,1,30);
})();

// ───── 按键参考页（首页下滑打开） ─────
(function(){
  const w=document.getElementById('cs');

  // Title
  el(w,{align:'center',dy:-122,font:20,color:GREY,text:'BUTTON REFERENCE'});
  // Top divider
  line(w,'sep',0,-100);

  // Left: A button
  const laKey=document.createElement('div');
  laKey.className='el'; laKey.style.cssText=`top:${233-64}px;left:calc(50% - 60px);font-size:22px;color:#fff;`;
  laKey.textContent='A'; w.appendChild(laKey);

  const laTap=document.createElement('div');
  laTap.className='el'; laTap.style.cssText=`top:${233-36}px;left:calc(50% - 60px);font-size:16px;color:${ORANGE};`;
  laTap.textContent='tap'; w.appendChild(laTap);

  const laTapV=document.createElement('div');
  laTapV.className='el'; laTapV.style.cssText=`top:${233-16}px;left:calc(50% - 60px);font-size:14px;color:${GREY};`;
  laTapV.textContent='Backspace'; w.appendChild(laTapV);

  const laHold=document.createElement('div');
  laHold.className='el'; laHold.style.cssText=`top:${233+10}px;left:calc(50% - 60px);font-size:16px;color:${ORANGE};`;
  laHold.textContent='hold'; w.appendChild(laHold);

  const laHoldV=document.createElement('div');
  laHoldV.className='el'; laHoldV.style.cssText=`top:${233+30}px;left:calc(50% - 60px);font-size:14px;color:${GREY};`;
  laHoldV.textContent='Enter'; w.appendChild(laHoldV);

  // Vertical separator — LV_ALIGN_CENTER means element CENTER at 233+dy
  const vsep=document.createElement('div');
  vsep.className='vsep';
  vsep.style.top=(233-10-55)+'px';  // center at y=223, height 110, so top=168
  w.appendChild(vsep);

  // Right: B button
  const rbKey=document.createElement('div');
  rbKey.className='el'; rbKey.style.cssText=`top:${233-64}px;left:calc(50% + 60px);font-size:22px;color:#fff;`;
  rbKey.textContent='B'; w.appendChild(rbKey);

  const rbTap=document.createElement('div');
  rbTap.className='el'; rbTap.style.cssText=`top:${233-36}px;left:calc(50% + 60px);font-size:16px;color:${ORANGE};`;
  rbTap.textContent='tap'; w.appendChild(rbTap);

  const rbTapV=document.createElement('div');
  rbTapV.className='el'; rbTapV.style.cssText=`top:${233-16}px;left:calc(50% + 60px);font-size:14px;color:${GREY};`;
  rbTapV.textContent='Esc'; w.appendChild(rbTapV);

  const rbHold=document.createElement('div');
  rbHold.className='el'; rbHold.style.cssText=`top:${233+10}px;left:calc(50% + 60px);font-size:16px;color:${ORANGE};`;
  rbHold.textContent='hold'; w.appendChild(rbHold);

  const rbHoldV=document.createElement('div');
  rbHoldV.className='el'; rbHoldV.style.cssText=`top:${233+30}px;left:calc(50% + 60px);font-size:14px;color:${GREY};`;
  rbHoldV.textContent='WeChat / Mic'; w.appendChild(rbHoldV);

  // Bottom divider
  line(w,'sep',0,78);
  // Dismiss hint
  el(w,{align:'center',dy:100,font:14,color:DIMIDLE,text:'tap anywhere to dismiss'});
})();
</script>
</body>
</html>
